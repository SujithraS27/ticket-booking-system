services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticket_booking
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticket_booking"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ticket_booking
      JWT_SECRET: change-me-in-production
      SEAT_HOLD_TTL_MS: "600000"
      WAITLIST_OFFER_TTL_MS: "600000"
      SCHEDULER_INTERVAL_MS: "5000"
      EMAIL_TRANSPORT: log
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      PORT: "5000"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata: